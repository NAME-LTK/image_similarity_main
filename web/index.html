<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智图寻宝</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f9;
      color: #18283b;
      font-family: Inter, system-ui, sans-serif;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 36px 20px;
    }

    h1 {
      margin: 0 0 24px;
    }

    h2 {
      margin: 24px 0 12px;
      font-size: 1.1rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    button {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      background: #2057a6;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    figure {
      margin: 0;
      padding: 12px;
      border-radius: 12px;
      background: white;
    }

    .preview {
      height: 155px;
      background: #f7f8fa;
      border-radius: 8px;
    }

    img {
      width: 100%;
      height: 155px;
      object-fit: contain;
    }

    figcaption {
      margin-top: 8px;
      text-align: center;
    }

    #matches img {
      padding: 10px;
      background: white;
      border-radius: 12px;
    }

    #category {
      font-weight: 600;
    }

    p:empty {
      display: none;
    }
  </style>
</head>

<body>
  <main>
    <h1>智图寻宝</h1>

    <div class="controls">
      <label>商品图片 <input id="upload" type="file" accept="image/*"></label>
      <button id="denoise" disabled>图像去噪</button>
      <button id="classify" disabled>商品分类</button>
      <button id="search" disabled>相似检索</button>
    </div>
    <p id="status" role="status"></p>

    <h2>去噪对比</h2>
    <div class="grid">
      <figure>
        <div class="preview"><img id="original" alt="原图" hidden></div>
        <figcaption>原图</figcaption>
      </figure>
      <figure>
        <div class="preview"><img id="noisy" alt="加噪图" hidden></div>
        <figcaption>加噪图</figcaption>
      </figure>
      <figure>
        <div class="preview"><img id="denoised" alt="去噪图" hidden></div>
        <figcaption>去噪图</figcaption>
      </figure>
    </div>

    <p id="category" aria-live="polite"></p>
    <h2>相似商品</h2>
    <div id="matches" class="grid"></div>
  </main>

  <script>
    const byId = (id) => document.getElementById(id);
    const upload = byId("upload");
    const denoise = byId("denoise");
    const classify = byId("classify");
    const search = byId("search");
    const status = byId("status");
    const category = byId("category");
    const matches = byId("matches");

    let originalUrl = "";
    let denoisedUrl = "";

    function showImage(id, url) {
      const image = byId(id);
      if (url) image.src = url;
      else image.removeAttribute("src");
      image.hidden = !url;
    }

    function updateControls(busy = false) {
      upload.disabled = busy;
      denoise.disabled = busy || !upload.files.length;
      classify.disabled = busy || !denoisedUrl;
      search.disabled = busy || !denoisedUrl;
    }

    function clearResults() {
      denoisedUrl = "";
      showImage("noisy", "");
      showImage("denoised", "");
      category.textContent = "";
      matches.replaceChildren();
    }

    upload.addEventListener("change", () => {
      if (originalUrl) URL.revokeObjectURL(originalUrl);
      const file = upload.files[0];
      originalUrl = file ? URL.createObjectURL(file) : "";
      showImage("original", originalUrl);
      clearResults();
      status.textContent = "";
      updateControls();
    });

    async function postImage(url, file) {
      const form = new FormData();
      form.append("image", file, file.name || "denoised.png");
      const response = await fetch(url, { method: "POST", body: form });
      if (!response.ok) throw new Error(`请求失败（HTTP ${response.status}）`);
      return response;
    }

    async function postDenoised(url) {
      const response = await fetch(denoisedUrl);
      return postImage(url, await response.blob());
    }

    async function run(message, task) {
      updateControls(true);
      status.textContent = message;
      try {
        await task();
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        updateControls();
      }
    }

    denoise.onclick = () => run("正在去噪…", async () => {
      clearResults();
      const response = await postImage("/denoising", upload.files[0]);
      const result = await response.json();
      denoisedUrl = `data:image/png;base64,${result.denoised_image}`;
      showImage("noisy", `data:image/png;base64,${result.noisy_img}`);
      showImage("denoised", denoisedUrl);
    });

    classify.onclick = () => run("正在分类…", async () => {
      const response = await postDenoised("/classification");
      category.textContent = await response.text();
    });

    search.onclick = () => run("正在查找相似商品…", async () => {
      const response = await postDenoised("/simimages");
      const result = await response.json();
      matches.replaceChildren(...result.image_urls.map((url, index) => {
        const image = document.createElement("img");
        image.src = url;
        image.alt = `相似商品 ${index + 1}`;
        return image;
      }));
    });
  </script>
</body>

</html>
